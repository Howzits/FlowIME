name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag and package.json version differ.' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FlowIME-win32-x64
          path: |
            dist/FlowIME-${{ steps.package.outputs.version }}-win32-x64.vsix
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: FlowIME-win32-x64
          path: release-assets
      - name: Create draft release from the verified artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $artifact = "release-assets/FlowIME-$version-win32-x64.vsix"
          $expected = (Get-Content release-assets/SHA256SUMS.txt).Split(' ')[0]
          if ((Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Artifact checksum mismatch.' }
          $notes = "聊天中文，终端英文。`n`nWindows x64 / VS Code 1.96+。此附件同时用于 Marketplace 上传，请勿二次打包。`n`n详情见 CHANGELOG.md 和 docs/COMPATIBILITY.md。真实输入法上屏仍需实测。"
          [IO.File]::WriteAllText('release-notes.md', $notes, [Text.UTF8Encoding]::new($false))
          gh release view $env:RELEASE_TAG --json isDraft *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite assets.' }
          gh release create $env:RELEASE_TAG $artifact release-assets/SHA256SUMS.txt --verify-tag --draft --title "FlowIME $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
